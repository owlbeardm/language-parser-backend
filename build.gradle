plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
    id 'com.intershop.gradle.scmversion' version '7.0.0'
}

group = 'by.c7d5a6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

bootJar.enabled = true
jar.enabled = false

scm {
    version {
        type = 'threeDigits'
        initialVersion = '1.0.0'
    }
}
version = scm.version.version

repositories {
    mavenCentral()
}

// see plugins
// config for org.springdoc.openapi-gradle-plugin
openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs.yaml")
    outputDir.set(file("../lp-api"))
    outputFileName.set("openapi.yaml")
    waitTimeInSeconds.set(10)
    customBootRun {
        args.set(["--spring.profiles.active=dev"])
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.3'
    // Auth
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.3.3'
    implementation 'com.google.firebase:firebase-admin:9.3.0'
    // Openapi
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.6.0'
    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.3'
    implementation 'org.flywaydb:flyway-core:10.17.2'
    implementation 'org.flywaydb:flyway-database-postgresql:10.17.2'
    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:6.6.0.Final'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    //Misc
    implementation 'org.modelmapper:modelmapper:3.2.1'
    //
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.3'
    testImplementation 'org.junit.platform:junit-platform-runner:1.8.2'
}

springBoot {
    buildInfo()
}

test {
    systemProperties['spring.test.context.cache.maxSize'] = 5
    maxHeapSize = "750m"
    useJUnitPlatform()
}

